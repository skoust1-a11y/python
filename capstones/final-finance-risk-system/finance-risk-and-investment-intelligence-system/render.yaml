# Render = API only. DB = Supabase, UI = Vercel (capstone/frontend/vercel.json proxies /api and /admin here).
# Dashboard: New → Blueprint → this GitHub repo. Paste the Supabase Session pooler URL into all three
# *_DATABASE_URL vars and the API keys when prompted. See deploy/README.md.
services:
  - type: web
    name: frii-api
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: prod
      - key: AUTH_MODE
        value: jwt
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_DATABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: STOCK_DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_FALLBACK_PROVIDER
        value: gemini
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        value: https://cloud.langfuse.com
