apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-risk-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finance-risk-api
  template:
    metadata:
      labels:
        app: finance-risk-api
    spec:
      containers:
        - name: api
          image: finance-risk-api:GIT_SHA
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: finance-risk-config
            - secretRef:
                name: finance-risk-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 20
