services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legaldoc-api
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+asyncpg://legaldoc:legaldoc_secret@postgres:5432/legaldoc_navigator
      DATABASE_SYNC_URL: postgresql+psycopg2://legaldoc:legaldoc_secret@postgres:5432/legaldoc_navigator
    volumes:
      - ./data/uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: legaldoc-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: legaldoc
      POSTGRES_PASSWORD: legaldoc_secret
      POSTGRES_DB: legaldoc_navigator
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legaldoc -d legaldoc_navigator"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
