// complete the code
syntax = "proto3";

package prompts;

// Service definition for Prompt Manager
// This service manages system prompts for different AI tasks
service PromptManager {
	rpc GetPrompt(PromptRequest) returns (PromptResponse);
}

message PromptRequest {
	string prompt_name = 1;
}

message PromptResponse {
	string prompt_name = 1;
	string prompt_text = 2;
	bool found = 3;
	string error_message = 4;
}


