[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c4-autonomous-investment-strategy-board"
version = "0.1.0"
description = "Prototype of a stateful multi-agent financial decision-support system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.32.0,<1",
    "pydantic-settings>=2.6.0,<3",
    "python-multipart>=0.0.18,<1",
    "openpyxl>=3.1.0,<4",
    "openai>=1.55.0,<2",
    "google-genai>=1.0.0,<2",
    "numpy>=1.26.0,<3",
    "scipy>=1.11.0,<2",
    "langgraph>=0.2.45,<1",
    "yfinance>=0.2.40,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
    "httpx>=0.27.0,<1",
]

[project.scripts]
aisb = "app.__main__:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
