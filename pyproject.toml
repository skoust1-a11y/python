[project]
name = "travel-bot-2"
version = "0.1.0"
description = "Travel Planner Advanced: FastAPI service demonstrating LangChain prompts, structured Pydantic output parsing, and retry parsing using an LLM (Gemini via langchain_openai)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.95.0",
	"pydantic>=2.0",
	"python-dotenv>=1.0.0",
	"uvicorn[standard]>=0.22.0",
	"langchain>=0.0.0",
	"langchain-openai>=0.1.0",
	"langfuse>=0.3.0"
]
