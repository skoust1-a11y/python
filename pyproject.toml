[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "c3-legaldoc-navigator"
version = "0.1.0"
description = "AI Legal Document Analysis System with RAG, SQL, and hybrid retrieval"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "C3 Team" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "qdrant-client>=1.12.0",
    "boto3>=1.35.0",
    "llama-index>=0.12.0",
    "llama-index-core>=0.12.0",
    "llama-index-vector-stores-postgres>=0.3.0",
    "llama-index-embeddings-openai>=0.3.0",
    "llama-index-llms-openai>=0.3.0",
    "llama-index-llms-anthropic>=0.6.0",
    "openai>=1.55.0",
    "anthropic>=0.40.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.2",
    "pytesseract>=0.3.13",
    "Pillow>=10.4.0",
    "tiktoken>=0.8.0",
    "guardrails-ai>=0.6.0,<0.11",
    "mcp>=1.7.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "ragas>=0.2.14",
    "langfuse>=4.0.0,<5.0.0",
    "langchain-openai>=0.3.0",
    "datasets>=3.0.0",
    "llama-index-llms-google-genai>=0.9.5",
    "llama-index-llms-groq>=0.5.0",
    "llama-index-llms-azure-openai>=0.5.0",
    "llama-index-embeddings-google-genai>=0.5.1",
    "google-genai>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.uv]
native-tls = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
